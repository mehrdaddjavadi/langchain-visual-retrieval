[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-visual-retrieval"
version = "0.1.0"
description = "Visual retrieval integration for LangChain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1.4.7,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/mehrdaddjavadi/langchain-visual-retrieval"
Repository = "https://github.com/mehrdaddjavadi/langchain-visual-retrieval"
Issues = "https://github.com/mehrdaddjavadi/langchain-visual-retrieval/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_visual_retrieval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
